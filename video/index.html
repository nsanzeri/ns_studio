<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nick Sanzeri — Top 30 TikTok Videos</title>

  <!-- TikTok embed script -->
  <script async src="https://www.tiktok.com/embed.js"></script>

  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0b0b0f;
      color: #eee;
    }
    header {
      padding: 28px 18px 10px;
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .sub { opacity: 0.8; margin: 0; }
    .bar {
      display: flex; gap: 10px; flex-wrap: wrap;
      padding: 14px 18px 18px;
      max-width: 1100px;
      margin: 0 auto;
      align-items: center;
    }
    input {
      flex: 1;
      min-width: 220px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: #eee;
      outline: none;
    }
    button {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.08);
      color: #eee;
      cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,0.12); }

    main {
      padding: 0 18px 40px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 16px;
    }
    @media (min-width: 740px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 1080px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .card {
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      padding: 10px;
      overflow: hidden;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      opacity: 0.85;
      margin: 2px 2px 10px;
    }
    .meta a { color: #9ad; text-decoration: none; }
    .meta a:hover { text-decoration: underline; }
    .hint {
      opacity: 0.75;
      font-size: 12px;
      margin-top: 10px;
      line-height: 1.4;
    }
    .empty {
      opacity: 0.8;
      border: 1px dashed rgba(255,255,255,0.18);
      border-radius: 14px;
      padding: 16px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Nick Sanzeri — Top 30 TikTok Videos</h1>
    <p class="sub">A simple gallery page with embedded TikToks.</p>
  </header>

  <div class="bar">
    <input id="filter" placeholder="Filter by URL text (optional) …" />
    <button id="reload">Reload embeds</button>
  </div>

  <main>
    <div id="grid" class="grid"></div>

    <p class="hint">
      Tip: If some embeds don’t show immediately, click “Reload embeds” (TikTok embeds can be finicky),
      or refresh the page once after the first load.
    </p>
  </main>

  <script>
    // Paste your 30 TikTok video URLs here:
    const VIDEO_URLS = [
"https://www.tiktok.com/@6915037268726514693/video/7602143795907398925",
"https://www.tiktok.com/@6915037268726514693/video/7600659392282889527",
"https://www.tiktok.com/@6915037268726514693/video/7602021143406447885",
"https://www.tiktok.com/@6915037268726514693/video/7598433141921008910",
"https://www.tiktok.com/@6915037268726514693/video/7597691269569170743",
"https://www.tiktok.com/@6915037268726514693/video/7592866778972179726",
"https://www.tiktok.com/@6915037268726514693/video/7602514894994312503",
"https://www.tiktok.com/@6915037268726514693/video/7597319791363296525",
"https://www.tiktok.com/@6915037268726514693/video/7591753493275299127",
"https://www.tiktok.com/@6915037268726514693/video/7594351100577189175",
"https://www.tiktok.com/@6915037268726514693/video/7596577526084914445",
"https://www.tiktok.com/@6915037268726514693/video/7593608968384073015",
"https://www.tiktok.com/@6915037268726514693/video/7592495773112126733",
"https://www.tiktok.com/@nicksanzeri/video/7522524573389081886",
"https://www.tiktok.com/@nicksanzeri/video/7512314944663129374",
"https://www.tiktok.com/@nicksanzeri/video/7598433141921008910",
"https://www.tiktok.com/@nicksanzeri/video/7591753493275299127",
"https://www.tiktok.com/@nicksanzeri/video/7520635439774977310",
"https://www.tiktok.com/@nicksanzeri/video/7512315543857138974",
"https://www.tiktok.com/@nicksanzeri/video/7525689925157555486",
"https://www.tiktok.com/@nicksanzeri/video/7517141810276322590",
"https://www.tiktok.com/@nicksanzeri/video/7517144232625212702",
"https://www.tiktok.com/@nicksanzeri/video/7544981214071885111",
"https://www.tiktok.com/@nicksanzeri/video/7592866778972179726",
"https://www.tiktok.com/@nicksanzeri/video/7512315995567017247",
"https://www.tiktok.com/@nicksanzeri/video/7515478238131457310",
"https://www.tiktok.com/@nicksanzeri/video/7524004905372110111",
"https://www.tiktok.com/@nicksanzeri/video/7525321513696890143",
"https://www.tiktok.com/@nicksanzeri/video/7543496648702315831",
"https://www.tiktok.com/@nicksanzeri/video/7514115610574376223" ];

    function videoIdFromUrl(u) {
      const m = String(u).match(/\/video\/(\d+)/);
      return m ? m[1] : null;
    }

    function render(urls) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      if (!urls.length) {
        grid.innerHTML = `
          <div class="empty">
            No videos to show yet.<br/>
            Paste up to 30 TikTok video URLs into <code>VIDEO_URLS</code> in this file.
          </div>`;
        return;
      }

      for (const url of urls) {
        const vid = videoIdFromUrl(url);
        const card = document.createElement("div");
        card.className = "card";

        // TikTok embed: blockquote with cite + data-video-id
        card.innerHTML = `
          <div class="meta">
            <span>${vid ? `Video ${vid}` : "TikTok Video"}</span>
            <a href="${url}" target="_blank" rel="noopener">Open ↗</a>
          </div>

          <blockquote class="tiktok-embed"
            cite="${url}"
            ${vid ? `data-video-id="${vid}"` : ""}
            style="max-width: 605px; min-width: 280px; margin: 0 auto;">
            <section></section>
          </blockquote>
        `;
        grid.appendChild(card);
      }

      // Ask TikTok's embed script to re-scan the page (works in many cases)
      if (window.tiktokEmbed && typeof window.tiktokEmbed.load === "function") {
        window.tiktokEmbed.load();
      } else {
        // Fallback: re-inject the embed script to force a scan
        const old = document.querySelector('script[src="https://www.tiktok.com/embed.js"]');
        if (old) old.remove();
        const s = document.createElement("script");
        s.async = true;
        s.src = "https://www.tiktok.com/embed.js";
        document.body.appendChild(s);
      }
    }

    const filterInput = document.getElementById("filter");
    const reloadBtn = document.getElementById("reload");

    function applyFilter() {
      const q = filterInput.value.trim().toLowerCase();
      const filtered = !q ? VIDEO_URLS : VIDEO_URLS.filter(u => u.toLowerCase().includes(q));
      render(filtered);
    }

    filterInput.addEventListener("input", applyFilter);
    reloadBtn.addEventListener("click", applyFilter);

    // initial render
    applyFilter();
  </script>
</body>
</html>
